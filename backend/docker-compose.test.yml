services:
  postgres_test:
    image: postgres:17-alpine
    container_name: orcamento-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orcamento_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orcamento_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_test_data:
