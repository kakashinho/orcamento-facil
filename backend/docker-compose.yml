# Ambiente de DESENVOLVIMENTO: API (recarga automática) + PostgreSQL + Nginx.
# Os segredos abaixo são apenas para desenvolvimento local — nunca use em produção.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: my-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/myapi
      PUBLIC_BASE_URL: http://localhost
      TRUST_PROXY: "true"
      JWT_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
      DATA_ENCRYPTION_KEY: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=
      ADMIN_EMAILS: admin@orcamentofacil.local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - "3000"

  postgres:
    image: postgres:17-alpine
    container_name: my-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: my-api-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
